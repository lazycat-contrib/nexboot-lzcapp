version: 1

project:
  root: .
  build_config: lzc-build.yml
  package_file: package.yml
  output: dist/nexboot.lpk
  target_arch: amd64

update:
  strategy: publish
  allow_downgrade: false
  version_source:
    type: image
    image: nexboot

build:
  run_buildscript: false

images:
  - id: nexboot
    target: service
    service: nexboot
    source: ghcr.io/dockers-x/nexboot
    channel: stable
    sort: semver
    tag_regex: '^v?\d+\.\d+\.\d+$'
    delivery:
      mode: mirror
      require_digest_match: true

stores:
  official:
    enabled: false
  private:
    enabled: true
    skip_if_version_exists: false
    name: NexBoot
    summary: "无盘启动平台：iPXE + ZFS + iSCSI"
