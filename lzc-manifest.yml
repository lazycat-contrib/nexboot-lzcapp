application:
  subdomain: nexboot
  background_task: true
  multi_instance: false
  public_path:
    - /
  upstreams:
    - location: /
      backend: http://nexboot:8080/
services:
  nexboot:
    # upstream: ghcr.io/dockers-x/nexboot:v1.0.2（dockers-x 自动跟随上游 tag 构建）
    # privileged: true 经 lzc-build.yml compose_override 注入
    image: ghcr.nju.edu.cn/dockers-x/nexboot:v1.0.2@sha256:51f7d612649111cd018fb7e76dce86fa7965f0fb6a4403fb5d877e3d1e4d5dab
