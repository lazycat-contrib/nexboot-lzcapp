application:
  subdomain: nexboot
  background_task: true
  multi_instance: false
  public_path:
    - /
  upstreams:
    - location: /
      backend: http://nexboot:8080/
services:
  nexboot:
    # upstream: ghcr.io/dockers-x/nexboot:v1.0.2
    image: ghcr.nju.edu.cn/dockers-x/nexboot:v1.0.2
    privileged: true
    # DHCP/PXE/iSCSI 需与客户机同二层网段
    network_mode: host
    environment:
      - TZ=Asia/Shanghai
      - NDISKLESS_ADDR=:8080
      - NDISKLESS_POOL=tank
      - NDISKLESS_BOOTSTRAP_USERNAME=admin
      # 首次生成随机密码（entrypoint 输出到日志并持久化）
      - NDISKLESS_BOOTSTRAP_PASSWORD={{ stable_secret "admin_password" }}
    binds:
      # SQLite 数据库、镜像导入目录
      - /lzcapp/var/nexboot/data:/var/lib/ndiskless
      # TFTP 资产（iPXE 固件）
      - /lzcapp/var/nexboot/tftp:/srv/tftp
      # dnsmasq 配置
      - /lzcapp/var/nexboot/dnsmasq:/etc/dnsmasq.d
      # ZFS 存储（宿主数据盘由管理员在 UI/命令行建池）
      - /lzcapp/var/nexboot/keepalived:/etc/keepalived
    healthcheck:
      test:
        - CMD
        - curl
        - -sf
        - http://127.0.0.1:8080/healthz
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
