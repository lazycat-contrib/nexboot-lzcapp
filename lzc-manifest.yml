application:
  subdomain: nexboot
  background_task: true
  multi_instance: false
  public_path:
    - /
  upstreams:
    - location: /
      backend: http://nexboot:8080/
services:
  nexboot:
    # upstream: ghcr.io/dockers-x/nexboot:v1.0.2
    # privileged: true 经 lzc-build.yml compose_override 注入
    image: ghcr.nju.edu.cn/dockers-x/nexboot:v1.0.2
